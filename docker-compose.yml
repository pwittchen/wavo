services:
  plainsong:
    # Published by plainsong's own CI (§10.4). To run against a local checkout
    # instead, put `build: ../plainsong` in a git-ignored
    # docker-compose.override.yml; see the README.
    image: ghcr.io/pwittchen/plainsong:${PLAINSONG_IMAGE_TAG:-latest}
    environment:
      PLAINSONG_TOKEN: ${PLAINSONG_TOKEN:?set PLAINSONG_TOKEN in .env}
      PLAINSONG_MAX_UPLOAD_MB: ${PLAINSONG_MAX_UPLOAD_MB:-100}
    volumes:
      - plainsong-data:/data
    # Published on port 40167 on every interface, IPv4 *and* IPv6, so the links
    # wavo sends work without a reverse proxy. The bare port is what binds both
    # `0.0.0.0` and `[::]`; spelling it out as `0.0.0.0:40167` silently means
    # IPv4 only, and anything that reaches the container over the host's public
    # IPv6 — a VPS provider's domain proxy, say — then finds nothing there. Set
    # PLAINSONG_PUBLISH=127.0.0.1:8080 to go back to loopback-only and terminate
    # TLS in front of it instead.
    ports:
      - "${PLAINSONG_PUBLISH:-40167}:8080"
    restart: unless-stopped

  wavo:
    # Published by this repo's CI on every push to master. To build from the
    # checkout instead, put `build: .` in a git-ignored
    # docker-compose.override.yml; see the README.
    image: ghcr.io/pwittchen/wavo:${WAVO_IMAGE_TAG:-latest}
    depends_on:
      plainsong:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      WAVO_ALLOWED_CHAT_IDS: ${WAVO_ALLOWED_CHAT_IDS:?set WAVO_ALLOWED_CHAT_IDS in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_MODEL_FALLBACK: ${OPENAI_MODEL_FALLBACK:-gpt-5}
      PLAINSONG_URL: http://plainsong:8080
      PLAINSONG_PUBLIC_URL: ${PLAINSONG_PUBLIC_URL:-http://127.0.0.1:40167}
      PLAINSONG_TOKEN: ${PLAINSONG_TOKEN:?set PLAINSONG_TOKEN in .env}
      PLAINSONG_MAX_UPLOAD_MB: ${PLAINSONG_MAX_UPLOAD_MB:-100}
      WAVO_MAX_CONCURRENT_JOBS: ${WAVO_MAX_CONCURRENT_JOBS:-1}
      WAVO_KEEP_JOB_FILES: ${WAVO_KEEP_JOB_FILES:-false}
      DEMIX_YT_DLP_ARGS: ${DEMIX_YT_DLP_ARGS:-}
      RUST_LOG: ${RUST_LOG:-wavo=info}
    # No port is published: long polling needs no ingress, and the health
    # endpoint is only used by the container health check.
    volumes:
      - wavo-work:/work
    restart: unless-stopped

volumes:
  plainsong-data:
  wavo-work:
