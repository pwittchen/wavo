[package]
name = "wavo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "AI agent for music processing over Telegram"
license = "Apache-2.0"
repository = "https://github.com/pwittchen/wavo"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24.0"
